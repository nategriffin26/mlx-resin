[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "resin-models-mlx"
version = "0.1.0"
description = "Apple Silicon model implementations for Resin, in MLX"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "resin[mlx]==0.1.0",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
]

[tool.uv.sources]
resin = { workspace = true }

[tool.uv.build-backend]
module-root = ""
